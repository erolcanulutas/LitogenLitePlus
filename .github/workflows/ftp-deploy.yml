name: Deploy to litogen.app

# By hand, never on a push.
#
# Pushing already publishes to GitHub Pages, which is where a change gets
# looked at. This is the other end of that: the live site moves when someone
# decides it should, not because a commit landed. Run it from the Actions tab —
# the branch or tag picker there chooses what goes out.
on:
  workflow_dispatch:
    inputs:
      note:
        description: "What is going out (shows up in the run's title)"
        required: false
        default: ""

# One deploy at a time, and let a running one finish: two curl loops writing
# into the same folder would interleave and leave a half-old build.
concurrency:
  group: ftp-litogen
  cancel-in-progress: false

run-name: >-
  Deploy ${{ github.ref_name }}${{ inputs.note && format(' — {0}', inputs.note) || '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No BASE_PATH: the site is served from the root of its own domain, which
      # is what vite.config.ts falls back to.
      - name: Build
        run: npm run build

      - name: Upload
        env:
          HOST: ${{ secrets.FTP_HOST }}
          USER: ${{ secrets.FTP_USER }}
          PASS: ${{ secrets.FTP_PASS }}
        run: |
          set -euo pipefail

          if [ -z "${HOST:-}" ] || [ -z "${USER:-}" ] || [ -z "${PASS:-}" ]; then
            echo "::error::FTP_HOST, FTP_USER and FTP_PASS are not set. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

          # Explicit TLS, so the password is not sent in the clear. The
          # certificate is the server's own rather than the domain's, which is
          # ordinary on shared hosting and is why it is not verified — the
          # encryption is the point here, not the identity.
          FTP="curl --silent --show-error --fail --ssl-reqd --insecure
               --retry 4 --retry-delay 6 --retry-connrefused
               --connect-timeout 30 --user $USER:$PASS"

          # Every file in one call, so curl opens the connection once and keeps
          # it. A call per file is a login per file, and a shared host counts
          # those: enough of them close together and its brute-force guard
          # stops answering on port 21 for a while, which is exactly what a
          # deploy looks like to it.
          args=()
          while read -r f; do
            path="${f#./}"
            echo "  $path"
            args+=(-T "dist/$path" "ftp://$HOST/public_html/$path")
          done < <( cd dist && find . -type f )

          for f in server/api/*.php server/api/.htaccess; do
            echo "  api/$(basename "$f")"
            args+=(-T "$f" "ftp://$HOST/public_html/api/$(basename "$f")")
          done

          echo "== uploading =="
          $FTP --ftp-create-dirs "${args[@]}"

          # Asset names carry a hash of their contents, so an old build's files
          # are never asked for again and only take up room. The page and the
          # API keep their names and are simply overwritten above.
          echo "== clearing out old assets =="
          $FTP --list-only "ftp://$HOST/public_html/assets/" | sed 's/\r$//' | grep -v '^\.\{1,2\}$' | sort > remote.txt
          ( cd dist/assets && ls ) | sort > local.txt
          # Again in one call: the deletes go down the same connection.
          dels=()
          while read -r old; do
            [ -n "$old" ] || continue
            echo "  $old"
            dels+=(-Q "DELE /public_html/assets/$old")
          done < <( comm -23 remote.txt local.txt )

          if [ ${#dels[@]} -gt 0 ]; then
            $FTP "${dels[@]}" --list-only "ftp://$HOST/public_html/assets/" -o /dev/null
          fi

          echo "== done =="

      - name: Check it answers
        run: |
          set -e
          code=$(curl -s -o /dev/null -w '%{http_code}' https://litogen.app/)
          echo "site: HTTP $code"
          [ "$code" = "200" ]
          curl -s https://litogen.app/api/me.php | grep -q '"ok":true'
          echo "api: answering"

          {
            echo "### Live"
            echo
            echo "- **https://litogen.app** is serving \`${GITHUB_SHA:0:7}\` from \`${GITHUB_REF_NAME}\`"
            echo "- the API answered"
          } >> "$GITHUB_STEP_SUMMARY"

# public_html/.htaccess is deliberately not deployed. cPanel writes its own
# blocks into that file — the PHP version handler among them — so a copy from
# the repository would quietly undo a version change made in the panel. It is
# set once, by hand, and the Litogen rules live at the end of it.
